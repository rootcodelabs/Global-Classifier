name: embedding-classifier-tests
on:
  push:
    branches:
      - dev
      - testing
      - wip
      - main
    paths:
      - "src/embedding-classifier/**"
      - ".github/workflows/embedding-classifier-tests.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/embedding-classifier/**"
      - ".github/workflows/embedding-classifier-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The version the package pins its client to
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    defaults:
      run:
        working-directory: src/embedding-classifier
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install uv==0.12.22
          uv sync --frozen --python 3.12
      # Unit, contract and builder tests: a fake encoder, no model download
      - name: Run tests
        env:
          QDRANT_URL: http://localhost:6333
        run: uv run pytest
