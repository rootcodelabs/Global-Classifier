name: Build & publish images to GHCR

on:
  push:
    branches:
      - kubernetes-deployment
  pull_request:
    branches:
      - kubernetes-deployment

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Build & push GUI image ----------
      - name: Build and push GUI image
        uses: docker/build-push-action@v4
        with:
          context: ./GUI
          file: ./GUI/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rootcodelabs/global-classifier-gui:latest
            ghcr.io/rootcodelabs/global-classifier-gui:${{ github.sha }}

      # ---------- Build & push Notifications server ---------------
      - name: Build and push Notifications server image
        uses: docker/build-push-action@v4
        with:
          context: ./notification-server
          file: ./notification-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rootcodelabs/global-classifier-notifications:latest
            ghcr.io/rootcodelabs/global-classifier-notifications:${{ github.sha }}

      - name: Output pushed images
        run: |
          echo "GUI: ghcr.io/rootcodelabs/global-classifier-gui:${GITHUB_SHA}"
          echo "Notifications: ghcr.io/rootcodelabs/global-classifier-notifications:${GITHUB_SHA}"