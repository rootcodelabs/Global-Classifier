replicas: 1
enabled: true
release_name: "component-byk-ruuter-public"

images:
  scope:
    registry: "ghcr.io"
    repository: "buerokratt/ruuter"
    tag: v2.2.1

service:
  type: ClusterIP
  port: 8086
  targetPort: 8086

env:
   # Global Classifier specific configuration (from docker-compose)
  APPLICATION_CORS_ALLOWEDORIGINS: "http://localhost:8086,http://localhost:3001,http://localhost:3003,http://localhost:3004,http://localhost:8080,http://localhost:8000,http://localhost:8090"
  APPLICATION_HTTPCODESALLOWLIST: "200,201,202,204,400,401,403,500"
  APPLICATION_INTERNALREQUESTS_ALLOWEDIPS: "127.0.0.1"
  APPLICATION_LOGGING_DISPLAYREQUESTCONTENT: "true"
  APPLICATION_LOGGING_DISPLAYRESPONSECONTENT: "true"
  APPLICATION_LOGGING_PRINTSTACKTRACE: "true"
  APPLICATION_INTERNALREQUESTS_DISABLED: "true"
  SERVER_PORT: "8086"
  
  # NoOps platform standards (additional BYK Stack requirements)
  LOGGING_LEVEL_ROOT: "INFO"
  LOG_LEVEL_TIMING: "INFO"
  APPLICATION_DSL_ALLOWEDFILETYPES: ".yml,.yaml,.md,.tmp"
  APPLICATION_HTTPRESPONSESIZELIMIT: "2000"
  APPLICATION_OPENSEARCHCONFIGURATION_INDEX: "ruuterlog"

resources:
  requests:
    memory: "1000Mi"
    cpu: "50m"
  limits:
    memory: "2000Mi"
    cpu: "50m"


ingress:
  enabled: true
  host: "global-classifier-ruuter.local"  # Change this to  domain
  corsAllowOrigin: "http://localhost:8086,http://localhost:3001,http://localhost:3003,http://localhost:3004,http://localhost:8080,http://localhost:8000,http://localhost:8090"
  ssl:
    enabled: false  # Set to true for production with proper certificates
    certIssuerName: "letsencrypt-prod"  # Your cert-manager issuer
    secretName: "global-classifier-ruuter-tls"
 

pullPolicy: IfNotPresent
