apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.release_name }}
  labels:
    app: {{ .Values.release_name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.release_name }}
  template:
    metadata:
      labels:
        app: {{ .Values.release_name }}
    spec:
      containers:
        - name: {{ .Values.release_name }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Values.release_name }}-config
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: output-datasets
              mountPath: /app/output_datasets
            - name: shared
              mountPath: /app/shared
            - name: models
              mountPath: /app/models
            - name: dummy-model
              mountPath: /app/dummy_model
            - name: cron-data
              mountPath: /app/data
            {{- end }}
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: http
          #   initialDelaySeconds: 30
          #   periodSeconds: 30
          #   failureThreshold: 3
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: http
          #   initialDelaySeconds: 10
          #   periodSeconds: 10
          #   failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: output-datasets
          persistentVolumeClaim:
            claimName: s3-ferry-output-datasets
        - name: shared
          persistentVolumeClaim:
            claimName: s3-ferry-shared
        - name: models
          persistentVolumeClaim:
            claimName: s3-ferry-models
        - name: dummy-model
          persistentVolumeClaim:
            claimName: s3-ferry-dummy-model
        - name: cron-data
          persistentVolumeClaim:
            claimName: s3-ferry-cron-data
        {{- end }}
   