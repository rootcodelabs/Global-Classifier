{{- if .Values.global.mlflow.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.global.mlflow.name }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.global.mlflow.name }}
    
  {{- with .Values.global.mlflow.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.global.mlflow.ingress.className }}
  ingressClassName: {{ .Values.global.mlflow.ingress.className }}
  {{- end }}
  {{- if .Values.global.mlflow.ingress.tls }}
  tls:
    {{- range .Values.global.mlflow.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.global.mlflow.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if .pathType }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              service:
                name: {{ $.Values.global.mlflow.name }}
                port:
                  number: {{ $.Values.global.mlflow.service.port }}
          {{- end }}
    {{- end }}
{{- end }}