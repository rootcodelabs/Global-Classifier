apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.release_name }}
  labels:
    app: {{ .Values.release_name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.release_name }}
  template:
    metadata:
      labels:
        app: {{ .Values.release_name }}
    spec:
      containers:
      - name: {{ .Values.release_name }}
        image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
        imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
        command: ["/bin/bash", "-c"]
        args:
        - |
          #!/bin/bash
          MODEL_NAME=${MODEL_NAME:-"{{ .Values.ollama.defaultModel | default "gemma2:2b" }}"}
          
          # Start Ollama in the background
          ollama serve &
          OLLAMA_PID=$!
          
          # Wait for Ollama API to be ready
          until ollama list > /dev/null 2>&1; do
            echo "Waiting for Ollama to start..."
            sleep 2
          done
          
          # Pull the model if not already present
          if ! ollama list | grep -q "$MODEL_NAME"; then
            echo "Pulling model $MODEL_NAME..."
            ollama pull "$MODEL_NAME"
          fi
          
          echo "Ollama is ready with model $MODEL_NAME"
          wait $OLLAMA_PID
        ports:
        - name: http
          containerPort: {{ .Values.ollama.port }}
          protocol: TCP
        env:
        - name: OLLAMA_USE_GPU
          value: "{{ .Values.ollama.environment.ollamaUseGpu }}"
        - name: OLLAMA_HOST
          value: "{{ .Values.ollama.environment.ollamaHost }}"
        volumeMounts:
        - name: ollama-models
          mountPath: {{ .Values.ollama.persistence.mountPath }}
        livenessProbe:
          httpGet:
            path: /api/tags
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/tags
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          {{- toYaml .Values.ollama.resources | nindent 10 }}
      volumes:
      - name: ollama-models
        persistentVolumeClaim:
          claimName: "{{ .Values.release_name }}-models"