  labels:
    app: {{ .Values.dashboards_release_name }}
  {{- with .Values.dashboards.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.dashboards.ingress.className }}
  ingressClassName: {{ .Values.dashboards.ingress.className }}
  {{- end }}
  {{- if .Values.dashboards.ingress.tls }}
  tls:
    {{- range .Values.dashboards.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.dashboards.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if .pathType }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              service:
                name: opensearch-dashboards
