{{- if .Values.dashboards.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.dashboards_release_name }}
  labels:
    app: {{ .Values.dashboards_release_name }}
spec:
  type: {{ .Values.dashboards.service.type }}
  ports:
  - port: {{ .Values.dashboards.service.port }}
    targetPort: {{ .Values.dashboards.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    app: {{ .Values.dashboards_release_name }}
   
{{- end }}