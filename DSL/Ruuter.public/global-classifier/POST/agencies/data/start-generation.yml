declaration:
  call: declare
  version: 0.1
  description: "Start one dataset generation run for all pending agency data requests"
  method: post
  accepts: json
  returns: json
  namespace: global-classifier

markStuckGenerationFailed:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_RESQL]/update-stuck-generation-failed"
  result: stuckResult
  error: returnDatabaseError
  next: checkGenerationInProgress

checkGenerationInProgress:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_RESQL]/check-generation-in-progress"
  result: inProgressResult
  error: returnDatabaseError
  next: evaluateGenerationInProgress

evaluateGenerationInProgress:
  switch:
    - condition: ${inProgressResult.response.body[0].inProgress}
      next: returnGenerationAlreadyRunning
  next: resetRetryableFailedRequests

resetRetryableFailedRequests:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_RESQL]/update-retryable-agency-data-requests"
  result: resetResult
  error: returnDatabaseError
  next: expireAgencyDataRequests

expireAgencyDataRequests:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_RESQL]/update-expired-agency-data-requests"
  result: expireResult
  error: returnDatabaseError
  next: claimPendingRequests

claimPendingRequests:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_RESQL]/update-claimed-agency-data-requests"
  result: claimResult
  error: returnDatabaseError
  next: evaluateClaimedRequests

evaluateClaimedRequests:
  switch:
    - condition: ${claimResult.response.body.length === 0}
      next: returnNothingPending
  next: extractClaimedRequests

extractClaimedRequests:
  assign:
    claimedRequests: ${claimResult.response.body}
    claimedRequestIds: ${JSON.stringify(claimResult.response.body.map(request => request.requestId))}
    hasNewAgency: ${claimResult.response.body.some(request => request.isNewAgency)}
  next: logClaimedRequests

logClaimedRequests:
  log: "Claimed ${claimedRequests.length} agency data requests, new agency: ${hasNewAgency}"
  next: chooseDatasetVersion

chooseDatasetVersion:
  switch:
    - condition: ${hasNewAgency}
      next: createMajorDatasetVersion
  next: createMinorDatasetVersion

createMajorDatasetVersion:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_RUUTER_PUBLIC]/datasets/version/major"
  result: datasetVersionResult
  error: failClaimedRequests
  next: validateDatasetVersion

createMinorDatasetVersion:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_RUUTER_PUBLIC]/datasets/version/minor"
  result: datasetVersionResult
  error: failClaimedRequests
  next: validateDatasetVersion

validateDatasetVersion:
  switch:
    - condition: ${!datasetVersionResult.response.body?.response || datasetVersionResult.response.body.response.length === 0}
      next: failClaimedRequests
  next: extractDatasetVersion

extractDatasetVersion:
  assign:
    datasetId: ${datasetVersionResult.response.body.response[0].id}
    majorVersion: ${datasetVersionResult.response.body.response[0].major}
    minorVersion: ${datasetVersionResult.response.body.response[0].minor}
  next: linkRequestsToDatasetVersion

linkRequestsToDatasetVersion:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_RESQL]/update-agency-data-requests-dataset-version"
    body:
      datasetVersionId: ${datasetId}
      requestIds: ${claimedRequestIds}
  result: linkResult
  error: markDatasetVersionFailed
  next: initiateDataGeneration

initiateDataGeneration:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_RUUTER_PUBLIC]/data/generate"
    body:
      datasetId: ${datasetId}
      majorVersion: ${majorVersion}
      minorVersion: ${minorVersion}
      presignedUrls: ${claimedRequests}
  result: generateResult
  error: markDatasetVersionFailed
  next: validateDataGeneration

validateDataGeneration:
  switch:
    - condition: ${200 <= generateResult.response.statusCodeValue && generateResult.response.statusCodeValue < 300}
      next: returnGenerationStarted
  next: markDatasetVersionFailed

markDatasetVersionFailed:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_RESQL]/update-data-generation-status"
    body:
      datasetId: ${String(datasetId)}
      generationStatus: "Generation_Failed"
  result: versionFailedResult
  error: completeFailedRequests
  next: completeFailedRequests

completeFailedRequests:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_RESQL]/update-completed-agency-data-requests"
    body:
      datasetId: ${String(datasetId)}
      generationStatus: "Generation_Failed"
      agencies: "[]"
  result: completeResult
  error: failClaimedRequests
  next: failClaimedRequests

failClaimedRequests:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_RESQL]/update-claimed-agency-data-requests-failed"
    body:
      requestIds: ${claimedRequestIds}
  result: failClaimedResult
  error: returnStartFailed
  next: returnStartFailed

returnGenerationAlreadyRunning:
  assign:
    startResponse:
      started: false
      reason: "generation already running"
  status: 200
  return: ${startResponse}
  next: end

returnNothingPending:
  assign:
    startResponse:
      started: false
      reason: "nothing pending"
  status: 200
  return: ${startResponse}
  next: end

returnGenerationStarted:
  assign:
    startResponse:
      started: true
      datasetId: ${datasetId}
      agencies: ${claimedRequests.length}
  status: 200
  return: ${startResponse}
  next: end

returnStartFailed:
  assign:
    startResponse:
      started: false
      reason: "generation could not be started"
  status: 500
  return: ${startResponse}
  next: end

returnDatabaseError:
  assign:
    startResponse:
      started: false
      reason: "database error"
  status: 500
  return: ${startResponse}
  next: end
