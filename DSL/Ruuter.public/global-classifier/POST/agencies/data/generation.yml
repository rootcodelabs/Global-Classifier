declaration:
  call: declare
  version: 0.1
  description: "Complete the agency data requests of a dataset version and update its generation status"
  method: post
  accepts: json
  returns: json
  namespace: global-classifier
  allowlist:
    body:
      - field: agencies
        type: array
        description: "Array of agencies with agencyId and syncStatus"
      - field: datasetId
        type: string
      - field: generationStatus
        type: string

extractRequestData:
  assign:
    agencies: ${incoming.body.agencies || []}
    datasetId: ${incoming.body.datasetId || ''}
    generationStatus: ${incoming.body.generationStatus || ''}
  next: completeAgencyDataRequests

completeAgencyDataRequests:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_RESQL]/update-completed-agency-data-requests"
    body:
      datasetId: ${String(datasetId)}
      generationStatus: ${generationStatus}
      agencies: ${JSON.stringify(agencies)}
  result: completeResult
  next: updateDatasetStatus

updateDatasetStatus:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_RESQL]/update-data-generation-status"
    body:
      datasetId: ${String(datasetId)}
      generationStatus: ${generationStatus}
  result: datasetUpdateResult
  next: return_result

return_result:
  return: "${agencies.length} agencies updated successfully."
  next: end