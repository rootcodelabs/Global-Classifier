declare:
  call: declare
  version: 0.1
  description: "Callback endpoint for dataset generation status logging"
  method: post
  accepts: json
  returns: json
  namespace: global-classifier
  allowlist:
    body:
      - field: task_id
        type: string
        description: "UUID string identifying the task"
      - field: status
        type: string
        description: "Task completion status (success, failed, etc.)"
      - field: message
        type: string
        description: "Status message or debug information"
      - field: filePath
        type: string
        description: "Path to the generated dataset file"
      - field: results
        type: array
        description: "List of agency IDs for which the dataset generation was completed"

log_callback_received:
  log: "Dataset generation callback received - Task ID: ${incoming.body.task_id}, Status: ${incoming.body.status}, File Path: ${incoming.body.filePath}"
  next: extract_callback_data

extract_callback_data:
  assign:
    task_id: ${incoming.body.task_id}
    status: ${incoming.body.status}
    message: ${incoming.body.message}
    file_path: ${incoming.body.filePath}
    results: ${encodeURIComponent(JSON.stringify(incoming.body.results))}
  next: log_detailed_info

log_detailed_info:
  log: "Callback Details - Task: ${task_id}, Status: ${status}, Message: ${message}, filePath: ${file_path}, results: ${results}"
  next: check_for_request_data

check_for_request_data:
  switch:
    - condition: ${task_id !== null && status !== null && message !== null && results !== null && (file_path !== null || status == "failed" || status == "error")}
      next: determine_status_response
  next: return_incorrect_request

determine_status_response:
  switch:
    - condition: ${status == "success"}
      next: handle_success_callback
    - condition: ${status == "failed" || status == "error"}
      next: handle_failure_callback
    - condition: true
      next: handle_unknown_status

handle_success_callback:
  assign:
    format_res:
      task_id: ${task_id}
      status: "received"
      message: "Success callback processed successfully"
  next: log_cron_manager_execution

log_cron_manager_execution:
  log: "Executing Cron Manager for callback formatting - Task ID: ${task_id}, File Path: ${file_path}, Results: ${results}"
  next: execute_cron_manager

execute_cron_manager:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_CRON_MANAGER]/execute/callback_formatter/callback_format"
    query:
      taskId: ${task_id}
      filePath: ${file_path}
      results: ${results}
  result: cron_res
  next: assign_success_cron_response

assign_success_cron_response:
  assign:
    format_success_cron_response_res:
      task_id: ${task_id}
      message: "Callback formatted started"
      operationSuccessful: true
  next: return_success

handle_failure_callback:
  assign:
    format_failure_callback_res:
      task_id: ${task_id}
      status: "received"
      message: "Failure callback processed"
  next: extract_failed_file_name

extract_failed_file_name:
  assign:
    failed_file_name: ${String(file_path || '').split('/').pop()}
  next: extract_failed_dataset_id

extract_failed_dataset_id:
  assign:
    failed_dataset_id: "${failed_file_name.endsWith('.csv') ? failed_file_name.slice(0, -4) : ''}"
  next: check_failed_dataset_id

check_failed_dataset_id:
  switch:
    - condition: ${failed_dataset_id !== '' && !isNaN(Number(failed_dataset_id))}
      next: log_failed_generation
  next: get_generation_in_progress

get_generation_in_progress:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_RESQL]/check-generation-in-progress"
  result: in_progress_res
  error: log_failed_dataset_not_found
  next: assign_in_progress_dataset_id

assign_in_progress_dataset_id:
  assign:
    failed_dataset_id: ${in_progress_res.response.body[0].datasetId}
  next: check_in_progress_dataset_id

check_in_progress_dataset_id:
  switch:
    - condition: ${failed_dataset_id === null || failed_dataset_id === undefined}
      next: log_failed_dataset_not_found
  next: log_failed_generation

log_failed_generation:
  log: "Marking dataset generation as failed - Task ID: ${task_id}, Dataset ID: ${failed_dataset_id}"
  next: update_failed_generation

update_failed_generation:
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_RUUTER_PUBLIC]/agencies/data/generation"
    body:
      datasetId: ${String(failed_dataset_id)}
      generationStatus: "Generation_Failed"
      agencies: []
  result: failed_generation_res
  error: log_failed_generation_update_error
  next: return_failure_details

log_failed_dataset_not_found:
  log: "Failure callback could not find the dataset ID - Task ID: ${task_id}, File Path: ${file_path}"
  next: return_failure_details

log_failed_generation_update_error:
  log: "Failure callback could not update the generation status - Task ID: ${task_id}, Dataset ID: ${failed_dataset_id}"
  next: return_failure_not_recorded

handle_unknown_status:
  assign:
    format_unknown_status_res:
      task_id: ${task_id}
      status: "received"
      message: "Unknown status callback processed"
  next: return_unknown_status

return_failure_details:
  status: 200
  return: ${format_failure_callback_res}
  next: end

# Recording the failure did not work, so let the generator retry the callback
return_failure_not_recorded:
  status: 500
  return: "Failure callback could not update the generation status"
  next: end

return_unknown_status:
  status: 200
  return: ${format_unknown_status_res}
  next: end

return_incorrect_request:
  status: 400
  return: 'Missing Required Fields'
  next: end

return_success:
  status: 200
  return: ${format_success_cron_response_res}
  next: end