declaration:
  call: declare
  version: 0.1
  description: "Export dataset model (JSON metadata or presigned URL)"
  method: get
  accepts: json
  returns: json
  namespace: global-classifier
  allowlist:
    params:
      - field: datasetId
        type: number
        description: "Dataset version id"

extract:
  assign:
    datasetId: ${Number(incoming.params.datasetId)}
    file_path: "/global-classifier/resources/datasets/${datasetId}"
    file_name: "aggregated_dataset.csv"
  switch:
    - condition: ${!datasetId || datasetId <= 0}
      next: bad_request
  next: fetchDataset

fetchDataset:
  log: "Transferring file from S3: ${file_path}"
  call: http.post
  args:
    url: "[#GLOBAL_CLASSIFIER_S3_FERRY]/v1/files/copy"
    headers:
      Content-Type: "application/json"
    body:
      sourceFilePath: ${file_name}
      sourceStorageType: "S3"
      destinationFilePath: ${'downloads/' + file_name}
      destinationStorageType: "FS"
  result: res
  switch:
    - condition: ${!res || res.status !== 200}
      next: upstream_error
    - condition: ${!res.response.body}
      next: not_found
  next: respondSuccess

respondSuccess:
  assign:
    body: ${res.response.body}
    response:
      datasetId: ${datasetId}
      file: ${body.file}
      presignedUrl: ${body.presignedUrl}
      datasetJson: ${body.datasetJson}
      message: ${body.message || 'Dataset JSON export successful'}
  return: ${response}
  status: 200
  next: end

bad_request:
  return: '{"error":"Invalid datasetId"}'
  status: 400
  next: end

upstream_error:
  return: '{"error":"Failed to retrieve dataset export"}'
  status: ${res.status || 502}
  next: end

not_found:
  return: '{"error":"No dataset content available"}'
  status: 404
  next: end
