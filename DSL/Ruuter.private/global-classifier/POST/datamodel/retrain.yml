declaration:
  call: declare
  version: 0.1
  description: "Description placeholder for 'RE-TRAIN'"
  method: post
  accepts: json
  returns: json
  namespace: global-classifier
  allowlist:
    body:
      - field: modelId
        type: number
        description: "Body field 'modelId'"
      - field: datasetId
        type: number
        description: "Body field 'datasetId'"
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

extract_request_data:
  assign:
    model_id: ${incoming.body.modelId}
    dataset_id: ${incoming.body.datasetId}
    cookie: ${incoming.headers.cookie}
    next: check_for_request_data

check_for_request_data:
  switch:
    - condition: ${model_id !== null} && ${dataset_id !== null}
      next: update_data_model_status
  next: return_incorrect_request

update_data_model_status:
  call: http.post
  args:
    url: "[#CLASSIFIER_RESQL]/update-data-model-status-by-model-id"
    body:
      id: ${model_id}
  result: res_model
  next: check_data_model_status

data_model_status_updated:
  switch:
    - condition: ${200 <= res_model.response.statusCodeValue && res_model.response.statusCodeValue < 300}
      next: execute_cron_manager
  next: assign_fail_response

execute_cron_manager:
  call: http.post
  args:
    url: "[#CLASSIFIER_CRON_MANAGER]/execute/data_model/model_trainer"
    query:
      cookie: ${cookie.replace('customJwtCookie=','')} #Removing the customJwtCookie phrase from payload to to send cookie token only
      modelId: ${model_id}
      datasetId: ${dataset_id}
  result: res
  next: assign_success_response

assign_success_response:
  assign:
    format_res: {
      modelId: '${model_id}',
      operationSuccessful: true,
    }
  next: return_ok

assign_fail_response:
  assign:
    format_res: {
      modelId: '${model_id}',
      operationSuccessful: false,
    }
  next: return_bad_request

return_ok:
  status: 200
  return: ${format_res}
  next: end

return_incorrect_request:
  status: 400
  return: 'Missing Required Fields'
  next: end

return_bad_request:
  status: 400
  return: ${format_res}
  next: end