[project]
name = "global-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litserve>=0.2.13",
    "loguru>=0.7.2",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "pydantic>=2.9.2",
    "pytest>=8.4.1",
    "requests>=2.32.0",
    "ruff>=0.11.11",
    "torch>=2.7.0",
]

[dependency-groups]
dev = [
    "minio>=7.2.9",
    "psycopg2-binary>=2.9.9",
    "testcontainers>=4.8.0",
]

[tool.ruff]
# Keep Markdown out of formatting (newer Ruff formats code blocks in .md files)
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Fix the rule set, so a new Ruff release doesn't turn on extra rules in CI
select = ["E4", "E7", "E9", "F"]

